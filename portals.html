<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portals | Moment/Portal</title>
    <link rel="stylesheet" href="portalstyle.css">
</head>
<body>
    <div class="portal-container">
        <div class="augment-container">
            <div class="stamen" id="stamen-augment" style="top: 33%; left: 22%; filter:hue-rotate(95deg);" data-target="augment">
                <a class="hover-wrapper" href="augment.html">
                    <img src="gradient.png" alt="gradient" class="hue-shift-img">
                    <div class="hover-text">
                        <h3>augment</h3>
                    </div>
                </a>
            </div>
        </div>
        <div class="release-container">
            <div class="stamen" id="stamen-release" style="top: 20%; left: 52%; filter:hue-rotate(302deg)" data-target="release">
                <a class="hover-wrapper" href=release.html>
                    <img src="gradient.png" alt="gradient" class="hue-shift-img">
                    <div class="hover-text">
                        <h3>release</h3>
                    </div>
                </a>
            </div>
        </div>
        <div class="nurture-container">
            <div class="stamen" id="stamen-nurture" style="top: 58%; left: 64%; filter:hue-rotate(5deg)" data-target="nurture">
                <a class="hover-wrapper" href="nurture.html">
                    <img src="gradient.png"  alt="gradient" class="hue-shift-img">
                    <div class="hover-text">
                        nurture
                    </div>
                </a>
            </div>
        </div>
        <div class="particle-container">
            <div class="stamen" id="stamen-particle" style="top: 62%; left: 25%; filter:hue-rotate(175deg)" data-target="particle">
                <a class="hover-wrapper" href="particle.html">
                    <img src="gradient.png" alt="gradient" class="hue-shift-img">
                    <div class="hover-text">
                        particle
                    </div>
                </a>
            </div>
        </div>
    </div>
    <div class="stamen" id="stamen-home" style="top: 10%; left: 10%;" data-target="home"><a href="index.html">home</a>
    </div>

    <!-- Reflection Spaces -->
    <div id="augment" class="reflection-space">
        <button class="back-button">Return</button>
        <h1>Augment</h1>
        <p>AUGMENT</p>
    </div>

    <div id="release" class="reflection-space">
        <button class="back-button">Return</button>
        <h1>release</h1>
        <p>RELEASE</p>
    </div>

    <div id="nurture" class="reflection-space">
        <button class="back-button">Return</button>
        <h1>nurture</h1>
        <p>NURTURE</p>
    </div>

    <div id="particle" class="reflection-space">
        <button class="back-button">Return</button>
        <h1>particle</h1>
        <p>PARTICLE</p>
    </div>

    <div id="home" class="reflection-space">
        <button class="back-button">Return</button>
        <h1>home</h1>
        <p>home</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
